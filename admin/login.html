<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Paroki Marga Agung</title>
<link rel="icon" href="../assets/crossIcon.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1A1A1E 0%, #2C2C30 60%, #1C1C1E 100%);
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Background decorations */
  body::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    top: -200px; right: -200px;
    background: radial-gradient(circle, rgba(184,134,11,0.18) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    bottom: -150px; left: -100px;
    background: radial-gradient(circle, rgba(212,160,23,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .login-card {
    background: rgba(255,255,255,0.96);
    border-radius: 28px;
    padding: 2.75rem 2.5rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.15);
    position: relative;
    z-index: 10;
  }

  .cross-badge {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #B8860B, #D4A017);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    color: white;
    margin: 0 auto 1.25rem;
    box-shadow: 0 8px 24px rgba(184,134,11,0.4);
  }

  .login-input {
    width: 100%;
    padding: 0.8rem 1rem 0.8rem 2.75rem;
    border: 1.5px solid #E5E7EB;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: #111;
    background: #FAFAFA;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .login-input:focus {
    border-color: #B8860B;
    box-shadow: 0 0 0 3px rgba(184,134,11,0.12);
    background: #fff;
  }

  .input-wrap { position: relative; }
  .input-icon {
    position: absolute;
    left: 0.85rem; top: 50%;
    transform: translateY(-50%);
    font-size: 1rem;
    pointer-events: none;
    opacity: 0.45;
  }

  .btn-login {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #B8860B, #D4A017);
    color: white;
    font-weight: 700;
    font-size: 0.95rem;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(184,134,11,0.35);
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .btn-login:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(184,134,11,0.45);
  }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

  .error-box {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: #DC2626;
    border-radius: 10px;
    padding: 0.65rem 1rem;
    font-size: 0.82rem;
    font-weight: 500;
    display: none;
    align-items: center;
    gap: 0.5rem;
  }
  .error-box.show { display: flex; }

  .back-link {
    display: inline-flex; align-items: center; gap: 0.35rem;
    color: rgba(255,255,255,0.55);
    font-size: 0.8rem;
    text-decoration: none;
    position: absolute;
    top: 1.5rem; left: 1.5rem;
    z-index: 20;
    transition: color 0.2s;
  }
  .back-link:hover { color: rgba(255,255,255,0.9); }
</style>
</head>
<body>

<a href="../index.html" class="back-link">← Kembali ke Website</a>

<div class="login-card">
  <div class="cross-badge">✝</div>

  <div class="text-center mb-6">
    <h1 class="font-bold text-xl" style="color:#111;letter-spacing:-0.01em">Admin Paroki</h1>
    <p class="text-sm mt-1" style="color:#888">Masuk untuk mengelola konten website</p>
  </div>

  <div id="errorBox" class="error-box mb-4">
    <span>⚠️</span>
    <span id="errorMsg">Email atau password salah.</span>
  </div>

  <form id="loginForm" class="space-y-4" autocomplete="off">
    <div class="form-group">
      <label class="block text-xs font-semibold mb-1.5" style="color:#444">Email Admin</label>
      <div class="input-wrap">
        <span class="input-icon">✉️</span>
        <input id="emailInput" type="email" class="login-input" placeholder="admin@paroki.com" required autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label class="block text-xs font-semibold mb-1.5" style="color:#444">Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input id="passwordInput" type="password" class="login-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
    </div>

    <button id="loginBtn" type="submit" class="btn-login mt-2">
      <span id="loginBtnIcon">🔑</span>
      <span id="loginBtnText">Masuk sebagai Admin</span>
    </button>
  </form>

  <p class="text-center text-xs mt-5" style="color:#bbb">
    Hanya untuk administrator yang berwenang.
  </p>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
(async () => {
  // Jika sudah login, langsung ke dashboard
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    window.location.replace('dashboard.html');
    return;
  }
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email    = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const btn      = document.getElementById('loginBtn');
  const btnText  = document.getElementById('loginBtnText');
  const btnIcon  = document.getElementById('loginBtnIcon');
  const errorBox = document.getElementById('errorBox');
  const errorMsg = document.getElementById('errorMsg');

  // Reset error
  errorBox.classList.remove('show');
  btn.disabled = true;
  btnText.textContent = 'Memverifikasi…';
  btnIcon.textContent = '⏳';

  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      errorMsg.textContent = 'Email atau password salah. Pastikan akun admin sudah dibuat di Supabase.';
      errorBox.classList.add('show');
      btn.disabled = false;
      btnText.textContent = 'Masuk sebagai Admin';
      btnIcon.textContent = '🔑';
      return;
    }

    btnText.textContent = 'Login berhasil! Mengalihkan…';
    btnIcon.textContent = '✅';

    setTimeout(() => {
      window.location.replace('dashboard.html');
    }, 600);

  } catch (err) {
    errorMsg.textContent = 'Terjadi kesalahan jaringan. Periksa koneksi internet Anda.';
    errorBox.classList.add('show');
    btn.disabled = false;
    btnText.textContent = 'Masuk sebagai Admin';
    btnIcon.textContent = '🔑';
  }
});
</script>
</body>
</html>
